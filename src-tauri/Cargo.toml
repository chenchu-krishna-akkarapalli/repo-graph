[package]
name = "repo-graph"
version = "0.1.0"
edition = "2021"
default-run = "repo-graph"
description = "Repo Graph core engine, MCP server, and Tauri desktop app"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
ignore = "0.4.30"
dunce = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swc_common = "24.0.0"
swc_ecma_ast = "26.0.0"
swc_ecma_parser = "42.0.0"
swc_ecma_visit = "26.0.0"
tauri = { version = "1", features = ["dialog-open", "window-show"] }
toml = "1.1.3"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
notify = "6.1.1"

# Real grammars for the languages that had only line scanners. JS/TS keeps
# `swc` — it is already a full AST and understands TS types natively.
tree-sitter = "0.26"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-swift = "0.7"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-php = "0.24"

# Exact token counts for the manifest budget. Anthropic ships no local
# tokenizer, so this is an explicit BPE proxy — see `tokens.rs`.
tiktoken-rs = "0.12"

[features]
# Required by tauri for dev-mode asset loading from devPath.
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "repo_graph"
path = "src/lib.rs"

[[bin]]
name = "repo-graph"
path = "src/main.rs"

[[bin]]
name = "mcp_server"
path = "src/bin/mcp_server.rs"
